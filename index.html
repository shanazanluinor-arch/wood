<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stromovka Grid Control</title>
    <style>
        body { background: #070a07; color: #b7e4c7; font-family: monospace; margin: 0; padding: 10px; font-size: 13px; }
        header { border-bottom: 2px solid #52b788; padding-bottom: 6px; margin-bottom: 12px; }
        .panel { background: #111a11; border: 1px solid #52b788; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        h3 { margin: 0 0 6px 0; color: #fff; font-size: 12px; text-transform: uppercase; }
        .tree-selector { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
        .tree-btn { background: #1b2e1a; border: 1px solid #52b788; color: #b7e4c7; padding: 8px; font-family: monospace; cursor: pointer; border-radius: 4px; text-align: left; font-size: 11px; }
        .tree-btn.active { background: #52b788; color: #000; font-weight: bold; }
        .micro-sonda { background: #000; border: 1px solid #1a3322; height: 100px; border-radius: 4px; position: relative; overflow: hidden; margin-top: 5px; }
        .mycelium-fiber { position: absolute; background: #52b788; opacity: 0.3; height: 1px; transform-origin: left center; }
        .node-dot { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 8px #fff; }
        .bio-stats { font-size: 11px; line-height: 1.5; background: #000; padding: 8px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid #52b788; }
        .terminal-chat { height: 100px; background: #040705; border: 1px solid #1a3322; padding: 8px; overflow-y: auto; margin-bottom: 8px; border-radius: 4px; font-size: 12px; }
        .msg { margin-bottom: 5px; padding: 4px; border-radius: 3px; }
        .msg.tree { background: #0b1c12; border-left: 3px solid #70e000; color: #e2f0d9; }
        .msg.user { background: #132a13; border-left: 3px solid #52b788; }
        .input-row { display: flex; gap: 6px; }
        .input-row input { flex-grow: 1; background: #000; border: 1px solid #52b788; color: #fff; padding: 8px; font-family: monospace; border-radius: 4px; }
        button.action { background: #52b788; color: #000; border: none; padding: 8px 12px; font-family: monospace; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .control-row { display: flex; gap: 6px; margin-top: 6px; }
        .ctrl-btn { flex: 1; font-size: 11px; background: #ffb703; color: #000; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <strong>STROMOVKA ČB: CENTRAL GRID CONTROL v3</strong><br>
        Stav: Sonda kořenových systémů stabilní.
    </header>

    <div class="panel">
        <h3>🎛️ Zvolit strom pod kontrolu</h3>
        <div class="tree-selector">
            <button class="tree-btn" id="btn-topol" onclick="selectTree('topol')">🌳 Topol S. (ID: 01)</button>
            <button class="tree-btn" id="btn-dub" onclick="selectTree('dub')">🌳 Dub Letní (ID: 02)</button>
            <button class="tree-btn" id="btn-vrba" onclick="selectTree('vrba')">🌳 Vrba Mokřad (ID: 03)</button>
            <button class="tree-btn" id="btn-lipa" onclick="selectTree('lipa')">🌳 Lípa JČU (ID: 04)</button>
        </div>
    </div>

    <div class="panel">
        <h3>👁️ Mikroskopická Sonda Pletiva Mycelia</h3>
        <div class="micro-sonda" id="sondaView"></div>
        <div class="bio-stats" id="bioStats">Načítám kořeny...</div>
        <div class="control-row">
            <button class="ctrl-btn" onclick="modifyTree('vitality', 5)">⚡ Glukóza (+5%)</button>
            <button class="ctrl-btn" style="background:#4cc9f0;" onclick="modifyTree('water', 10)">💧 Voda (+10%)</button>
        </div>
    </div>

    <div class="panel">
        <h3>💬 Nativní kanál se stromem</h3>
        <div class="terminal-chat" id="chatBox"></div>
        <div class="input-row">
            <input type="text" id="chatInput" placeholder="Napiš stromu...">
            <button class="action" onclick="sendToTree()">Vyslat</button>
        </div>
    </div>

    <script>
        var TREES_DATA = {
            topol: {
                name: "Topol kanadsky", vitality: 45, water: 30, phosphate: 12,
                responses: [
                    "Moje stare kmeny drevnati. Citim slaby tok cukru. Dekuji za energetickou dotaci.",
                    "Koreny v sektoru A vykazuji sucho. Posli vice vlahy skrze pletivo.",
                    "Signal zachycen. Mycelium lisky kolem me slabne, potrebuji stabilitu."
                ]
            },
            dub: {
                name: "Dub letni", vitality: 88, water: 75, phosphate: 65,
                responses: [
                    "Mam dostatek slunecniho svitu. Prebytecny uhlik posilam staremu topolu.",
                    "Moje hluboke koreny narazily on spodni vodu. Jsem v plne sile.",
                    "Vnimam tvuj digitalni impuls. Moje obranne enzymy proti skudcum jsou aktivni."
                ]
            },
            vrba: {
                name: "Vrba krehka", vitality: 70, water: 95, phosphate: 40,
                responses: [
                    "Vlhkost je optimalni, koreny jsou ponorene v mokradu u reky.",
                    "Filtruji mestske dusicnany. Cistim biosferu parku.",
                    "Puls site je klidny. Prenasim bio-vlny smerem k univerzite."
                ]
            },
            lipa: {
                name: "Lipa Olgy Havlove", vitality: 95, water: 60, phosphate: 80,
                responses: [
                    "Vnimam aktivitu v kampusu. Moje listy uklada ji maximum uhliku.",
                    "Spojeni s vnitrnim parkem je ciste. Vysilam asistenci o sile 3.1 Hz.",
                    "Kolektivni podhoubi kolem mych korenu prosperuje. Sit je stabilni."
                ]
            }
        };

        var activeTree = 'topol';

        function selectTree(treeKey) {
            activeTree = treeKey;
            var keys = ['topol', 'dub', 'vrba', 'lipa'];
            for(var i=0; i<keys.length; i++) {
                var btn = document.getElementById('btn-' + keys[i]);
                if (btn) {
                    btn.className = (keys[i] === treeKey) ? 'tree-btn active' : 'tree-btn';
                }
            }
            updateVisuals();
            var chat = document.getElementById('chatBox');
            chat.innerHTML = "<div class='msg tree'><strong>[" + TREES_DATA[treeKey].name + "]:</strong> Spojeni navazano. Moje vitalita je " + TREES_DATA[treeKey].vitality + "%. Posloucham tvou frekvenci.</div>";
            chat.scrollTop = chat.scrollHeight;
        }

        function modifyTree(param, val) {
            var t = TREES_DATA[activeTree];
            t[param] += val;
            if(t[param] > 100) t[param] = 100;
            updateVisuals();
            var chat = document.getElementById('chatBox');
            var actionName = (param === 'vitality') ? "Injektovana glukoza" : "Spustena zavlaha";
            chat.innerHTML += "<div class='msg user'><strong>[Prikaz]:</strong> " + actionName + " na " + t.name + " (" + t[param] + "%).</div>";
            chat.scrollTop = chat.scrollHeight;
        }

        function sendToTree() {
            var input = document.getElementById('chatInput');
            var msg = input.value.trim();
            if(!msg) return;
            var t = TREES_DATA[activeTree];
            var chat = document.getElementById('chatBox');
            chat.innerHTML += "<div class='msg user'><strong>Vy:</strong> " + msg + "</div>";
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
            setTimeout(function() {
                var replies = t.responses;
                var randomReply = replies[Math.floor(Math.random() * replies.length)];
                chat.innerHTML += "<div class='msg tree'><strong>[" + t.name + "]:</strong> " + randomReply + "</div>";
                chat.scrollTop = chat.scrollHeight;
                generateMicroNetworkGraphics(t.vitality);
            }, 400);
        }

        function updateVisuals() {
            var t = TREES_DATA[activeTree];
            document.getElementById('bioStats').innerHTML = "<strong>Strom:</strong> " + t.name + "<br>Vitalita: " + t.vitality + "% | Voda: " + t.water + "% | Fosfaty: " + t.phosphate + "%";
            generateMicroNetworkGraphics(t.vitality);
        }

        function generateMicroNetworkGraphics(intenzita) {
            var view = document.getElementById('sondaView');
            if (!view) return;
            view.innerHTML = '';
            var pocetVlaken = Math.floor(intenzita / 3);
            if(pocetVlaken < 10) pocetVlaken = 10;
            for(var i=0; i<pocetVlaken; i++) {
                var line = document.createElement('div');
                line.className = 'mycelium-fiber';
                line.style.width = (Math.random() * 60 + 20) + 'px';
                line.style.top = (Math.random() * 100) + '%';
                line.style.left = (Math.random() * 100) + '%';
                line.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                view.appendChild(line);
            }
            for(var j=0; j<3; j++) {
                var dot = document.createElement('div');
                dot.className = 'node-dot';
                dot.style.top = (Math.random() * 80 + 10) + '%';
                dot.style.left = (Math.random() * 80 + 10) + '%';
                view.appendChild(dot);
            }
        }

        var viewCanvas = document.getElementById('sondaView');
        if(viewCanvas) {
            selectTree('topol');
        }

        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendToTree();
        });
    </script>
</body>
</html>
